name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: google/wireit@setup-github-actions-caching/v2
      - run: npm ci
      - run: npm test
      - run: npm run demo:build
